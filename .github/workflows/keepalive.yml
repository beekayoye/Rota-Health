name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health URL
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          curl -fsS --max-time 30 "$API_HEALTH_URL"
